# Reviewed replacement for /etc/nginx/sites-available/default.
# Replace MEDIA_AUTH_SHARED_SECRET_VALUE before installing this file. The same
# value must be present as MEDIA_AUTH_SHARED_SECRET in backend/.env.

server {
    listen 443 ssl;
    server_name app.vohk.cl;
    ssl_certificate /etc/letsencrypt/live/app.vohk.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.vohk.cl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/Sistema_Vohk/frontend/dist/vohk;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf)$ {
        expires 30d;
        access_log off;
    }
    add_header Cross-Origin-Embedder-Policy unsafe-none always;
}

server {
    listen 443 ssl;
    server_name one.vohk.cl;
    ssl_certificate /etc/letsencrypt/live/app.vohk.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.vohk.cl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/Sistema_Vohk/frontend/dist/vohk-one;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
    add_header Cross-Origin-Embedder-Policy unsafe-none always;
}

server {
    listen 443 ssl;
    server_name api.vohk.cl;
    ssl_certificate /etc/letsencrypt/live/app.vohk.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.vohk.cl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 20M;

    # Nginx-only subrequest. It validates the signed URL before static files are served.
    location = /_media_authorize {
        internal;
        proxy_pass http://127.0.0.1:8080/api/media/nginx-authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Media-Auth-Secret "MEDIA_AUTH_SHARED_SECRET_VALUE";
    }

    # Do not expose the two backend-to-proxy authorization callbacks publicly.
    location = /api/media/nginx-authorize { return 404; }
    location = /api/media/mediamtx-authorize { return 404; }

    location /webrtc/ {
        proxy_pass http://127.0.0.1:8889/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
    }
    location ~ ^/cam[^/]+/ {
        proxy_pass http://127.0.0.1:8889;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
    }
    location /snapshots/ {
        auth_request /_media_authorize;
        alias /var/www/snapshots/;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires 0 always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Access-Control-Allow-Origin "*" always;
        access_log off;
    }
    location /detections/ {
        auth_request /_media_authorize;
        alias /var/www/detections/;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        access_log off;
    }

    location ~ ^/v1(?:/|$) {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/(?:v0|mail)(?:/|$) {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/monday(?:/|$) {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 80;
    server_name app.vohk.cl one.vohk.cl api.vohk.cl;
    return 301 https://$host$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    root /opt/papigiras-dashboard;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf)$ {
        expires 30d;
        access_log off;
    }
}

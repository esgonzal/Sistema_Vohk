# Review copy of /etc/nginx/sites-available/default, based on the supplied config.
# Keep the existing certificate paths; confirm the certificate covers both hosts.
# This file belongs inside nginx's http context (sites-enabled), not nginx.conf.
server {
    listen 443 ssl;
    server_name app.vohk.cl;
    ssl_certificate /etc/letsencrypt/live/app.vohk.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.vohk.cl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/Sistema_Vohk/frontend/dist/vohk;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf)$ {
        expires 30d;
        access_log off;
    }
    add_header Cross-Origin-Embedder-Policy unsafe-none always;
}

server {
    listen 443 ssl;
    server_name api.vohk.cl;
    ssl_certificate /etc/letsencrypt/live/app.vohk.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.vohk.cl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 20M;

    location /webrtc/ {
        proxy_pass http://127.0.0.1:8889/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_request_buffering off;
    }
    location ~ ^/cam[^/]+/ {
        proxy_pass http://127.0.0.1:8889;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_request_buffering off;
    }
    location /snapshots/ {
        alias /var/www/snapshots/;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Access-Control-Allow-Origin "*" always;
        access_log off;
    }
    location /detections/ {
        alias /var/www/detections/;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        access_log off;
    }

    # No URI suffix in proxy_pass: preserve /v1, /v0, /mail and /monday.
    # Boundaries match both the mount root and its children, but not /v10, etc.
    location ~ ^/v1(?:/|$) {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/(?:v0|mail)(?:/|$) {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/monday(?:/|$) {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # /api, /api/intercom-talk, /debug.jpg and the existing fallback.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 80;
    server_name app.vohk.cl;
    return 301 https://$host$request_uri;
}
server {
    listen 80;
    server_name api.vohk.cl;
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 80 default_server;
    server_name _;
    root /opt/papigiras-dashboard;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf)$ {
        expires 30d;
        access_log off;
    }
}

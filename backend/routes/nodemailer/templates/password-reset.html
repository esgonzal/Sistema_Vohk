<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer contraseña</title>
</head>

<body style="margin:0;padding:0;background-color:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#202124;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 16px;">
        <tr>
            <td align="center">
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0"
                    style="max-width:600px;background-color:#ffffff;border-radius:12px;overflow:hidden;">
                    <tr>
                        <td style="padding:24px;background-color:#111827;color:#ffffff;text-align:center;">
                            <h1 style="margin:0;font-size:26px;">VÖHK</h1>
                            <p style="margin:6px 0 0;font-size:12px;letter-spacing:2px;">CONDOMINIOS</p>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:32px;">
                            <h2 style="margin-top:0;">Hola {{legalName}}</h2>
                            <p>Recibimos una solicitud para restablecer tu contraseña.</p>
                            <p>Puedes crear una nueva contraseña usando el siguiente botón:</p>
                            <p style="text-align:center;margin:32px 0;">
                                <a href="{{resetUrl}}"
                                    style="display:inline-block;padding:14px 24px;background-color:#111827;color:#ffffff;text-decoration:none;border-radius:8px;font-weight:bold;">
                                    Restablecer contraseña
                                </a>
                            </p>
                            <p>Este enlace expirará en 30 minutos.</p>
                            <p style="color:#6b7280;font-size:13px;">Si no solicitaste este cambio, puedes ignorar este
                                correo.</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>

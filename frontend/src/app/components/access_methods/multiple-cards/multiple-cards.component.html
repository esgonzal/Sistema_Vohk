<div class="pagina_completa" [ngClass]="{'dark-mode': DarkModeService.darkMode}">
    <app-loader [loader]="isLoading"></app-loader>

    <div class="form-area">
        <h2 class="titulo">Generar múltiples tarjetas</h2>

        <div class="config-section">
            <button class="form-button" type="button" (click)="toggleLocks()">
                {{ showLocks ? 'Ocultar cerraduras ▲' : 'Seleccionar cerraduras ▼' }}
            </button>

            <div *ngIf="showLocks" class="locks-container">
                <label *ngFor="let lock of locksOfGroup" class="lock-row">
                    <input type="checkbox" [checked]="isLockSelected(lock.lockId)" (change)="toggleLock(lock, $event)">
                    {{ lock.lockAlias }}
                </label>
            </div>

            <div *ngIf="selectedLocks.length > 0" class="selected-locks">
                <strong>Cerraduras seleccionadas:</strong>
                <ul>
                    <li *ngFor="let lock of selectedLocks">{{ lock.lockAlias }}</li>
                </ul>
            </div>
        </div>

        <hr>

        <h3>Tarjetas</h3>

        <div class="button-row">
            <button class="import" type="button" (click)="fileInput.click()">Importar desde Excel</button>
            <button class="import" type="button" (click)="downloadExcelTemplate()">Descargar plantilla</button>
            <input hidden #fileInput type="file" accept=".xlsx,.xls,.csv" (change)="onFileSelected($event)">
        </div>

        <table class="card-table">
            <thead>
                <tr>
                    <th style="width:40%">Nombre</th>
                    <th style="width:20%">Tipo</th>
                    <th style="width:30%">Número</th>
                    <th style="width:10%">Eliminar</th>
                </tr>
            </thead>

            <tbody>
                <tr *ngFor="let card of cards; let i = index">
                    <td>
                        <input type="text" [(ngModel)]="card.name" name="name_{{i}}" placeholder="Nombre tarjeta">
                    </td>
                    <td>
                        <select [(ngModel)]="card.tipo" name="tipo_{{i}}">
                            <option [ngValue]="1">Permanente</option>
                        </select>
                    </td>
                    <td>
                        <input type="text" [(ngModel)]="card.number" name="number_{{i}}" placeholder="Número tarjeta">
                    </td>
                    <td>
                        <button class="custom-button-eliminar" type="button" (click)="removeCard(i)">X</button>
                    </td>
                </tr>
            </tbody>
        </table>

        <div class="buttons">
            <button class="form-button" type="button" (click)="addCard()">Agregar tarjeta</button>
            <button class="form-button" type="button" (click)="generate()">Generar tarjetas</button>
        </div>
    </div>
</div>

<app-access-modal *ngIf="popupService.multipleCardsResult" style="z-index:10"></app-access-modal>
